<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>StarPrivacyBot</title>
  <link rel="stylesheet" href="/styles.css" />
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand">
        <div class="logo">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="#0A0D13"><path d="M12 1l3.09 6.26L22 8.27l-5 4.87 1.18 6.88L12 16.9l-6.18 3.12L7 13.14 2 8.27l6.91-1.01L12 1z"/></svg>
        </div>
        <span class="name">StarPrivacyBot</span>
      </div>
      <button id="tier-pill" class="tier-pill">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="#F7CE68"><path d="M12 1l3.09 6.26L22 8.27l-5 4.87 1.18 6.88L12 16.9l-6.18 3.12L7 13.14 2 8.27l6.91-1.01L12 1z"/></svg>
        <span id="tier-pill-text">…</span>
      </button>
    </header>

    <main id="content" class="content"></main>

    <nav class="tabbar">
      <button class="tab-btn active" data-tab="dashboard">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
        <span>Главная</span>
      </button>
      <button class="tab-btn" data-tab="archive">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18"/><path d="M8 14h8"/></svg>
        <span>Архив</span>
      </button>
    </nav>

    <div id="sheet-overlay" class="sheet-overlay" hidden>
      <div id="sheet" class="sheet"></div>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
